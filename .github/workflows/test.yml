name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  push:
    branches:
      - main

# one run per pull request: opening one with a label fires two events at once
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Lint the workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Lint the scripts
        run: shellcheck scripts/*.sh

      - name: Test the scripts
        run: |
          sudo apt-get install --yes --no-install-recommends bats >/dev/null
          bats tests

  # The release of a merged pull request follows its semver label, so every pull request needs one.
  # This runs chart-pr.yml from the pull request itself: with no charts in this repository it only
  # checks the label, and it exercises the workflow before it is released.
  semver-label:
    if: github.event_name == 'pull_request'
    needs: test
    uses: ./.github/workflows/chart-pr.yml
    permissions:
      contents: write
      pull-requests: write
