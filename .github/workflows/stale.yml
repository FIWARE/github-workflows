# Reusable workflow that marks issues and pull requests without activity as stale, and closes them
# when they stay so. See README.md for how to call it.
name: Stale

on:
  workflow_call:
    inputs:
      days-before-stale:
        description: Days without activity before an issue or pull request is marked as stale
        type: number
        default: 30
      days-before-close:
        description: Days a stale issue or pull request stays open before it is closed
        type: number
        default: 5

jobs:
  stale:
    name: Mark and close stale issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          stale-issue-message: >-
            This issue is stale because it has been open ${{ inputs.days-before-stale }} days with no activity.
            Remove the stale label or comment, or this will be closed in ${{ inputs.days-before-close }} days.
          stale-pr-message: >-
            This pull request is stale because it has been open ${{ inputs.days-before-stale }} days with no activity.
            Remove the stale label or comment, or this will be closed in ${{ inputs.days-before-close }} days.
